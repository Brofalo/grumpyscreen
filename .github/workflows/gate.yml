name: gate
on:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    # Local, not PONOdata/gatekeeper: this repo is public and gatekeeper is
    # private, and a public repo cannot call a private repo's reusable
    # workflow. The local copy is the workaround, not drift. It has to be kept
    # in step with gatekeeper by hand, because no tag reaches it.
    uses: ./.github/workflows/reusable-ci.yml
    with:
      runner_labels: '["ubuntu-latest"]'
      # All four were blank, and the vendored copy above used to treat a blank
      # command as a pass. It no longer does, so each gate is now either armed
      # or named here with a reason.
      #
      # build is ARMED. It needed two things the gate did not provide:
      # recursive submodules (lvgl, libhv, lv_drivers and the rest), and the
      # pellcorp/guppydev cross-compile toolchain. The vendored reusable now
      # takes checkout_submodules, and the toolchain comes in as a container
      # this step drives itself, since the reusable exposes no container: key.
      #
      # One target, not the three branch.yml builds. That matrix still runs on
      # every push and keeps the arch spread covered; this is the copy a merge
      # is not allowed past, so it is sized to stay inside the gate's 30 minute
      # budget rather than to be exhaustive. The same reasoning pono-kalico
      # used for running one interpreter instead of six.
      #
      # --user 1001 matches what branch.yml passes the image. make wpaclient
      # and make libhv.a come first for the same reason they do there: the
      # main make depends on both.
      #
      # test stays declared: there is no test suite in this tree, only the
      # build, and calling the build a test would be the same false green this
      # migration removed.
      #
      # lint: the C++ here is upstream guppyscreen's layout with a `fmt`
      # script rather than a checked-in clang-format gate, and the handful of
      # python files are tooling rather than shipped code.
      # typecheck: not applicable to C++.
      checkout_submodules: recursive
      build_cmd: >-
        docker run --rm --user 1001 -v "$PWD":/work -w /work
        -e CROSS_COMPILE=mipsel-buildroot-linux-musl-
        -e CC=mipsel-buildroot-linux-musl-
        -e CXX=mipsel-buildroot-linux-musl-
        pellcorp/guppydev:latest
        bash -c "make wpaclient && make libhv.a && make -j"
      unconfigured_ok: "lint,typecheck,test"
      run_semgrep: true
      # Stated rather than inherited. gate/tell_check is a required context
      # here, and it had been reporting success while running nothing: the
      # vendored copy defaulted run_tell_check to false and no caller set it.
      run_tell_check: true
      run_dependency_review: true
